<svg viewBox="0 0 1240 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .stage{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:14;}
      .node{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.2;}
      .t{fill:#0f172a;font-size:15px;font-weight:600;}
      .s{fill:#475569;font-size:12.5px;}
      .lane{fill:#3b82f6;font-size:12px;font-weight:700;letter-spacing:2px;}
      .flow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arr);}
      .mono{font-family:Consolas,Menlo,monospace;}
    </style>
  </defs>

  <rect width="1240" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="1240" height="86" fill="url(#hdr)"/>
  <text x="40" y="38" fill="#ffffff" font-size="24" font-weight="800">Facility-Wide Inventory Management Ecosystem</text>
  <text x="40" y="64" fill="#dbeafe" font-size="14">Universal labeling · scan-driven traceability · smart storage · ERP integration &#160;&#160;|&#160;&#160; sanitized architecture view</text>

  <!-- STAGE 1: RECEIVING -->
  <text x="60" y="128" class="lane">1 · RECEIVING</text>
  <rect x="40" y="140" width="260" height="170" class="stage" rx="14"/>
  <rect x="58" y="158" width="224" height="56" class="node" rx="8"/>
  <text x="70" y="181" class="t">ERP purchase orders</text>
  <text x="70" y="200" class="s">Open PO lines pulled as the</text>
  <text x="70" y="215" class="s" transform="translate(0,-1)">validation source</text>
  <rect x="58" y="228" width="224" height="66" class="node" rx="8"/>
  <text x="70" y="251" class="t">Receiving-mode scan</text>
  <text x="70" y="270" class="s">Incoming reels validated against</text>
  <text x="70" y="285" class="s">PO · mismatches flagged instantly</text>

  <!-- STAGE 2: UNIVERSAL LABEL -->
  <text x="360" y="128" class="lane">2 · UNIVERSAL LABEL</text>
  <rect x="340" y="140" width="290" height="170" class="stage" rx="14"/>
  <rect x="358" y="158" width="254" height="70" fill="#0f172a" rx="8"/>
  <text x="372" y="185" fill="#93c5fd" font-size="13" class="mono">{UID-0000001 @ MPN-XXXXX</text>
  <text x="372" y="205" fill="#93c5fd" font-size="13" class="mono">@ LOT-XXXX @ Q1000 @ DC2401</text>
  <text x="372" y="222" fill="#c4b5fd" font-size="12" class="mono">@ PO-0000001}  ← example only</text>
  <text x="372" y="252" class="t">One identity per reel</text>
  <text x="372" y="272" class="s">UID · part · lot · quantity · date code · PO</text>
  <text x="372" y="290" class="s">carried through every operation</text>

  <!-- STAGE 3: KITTING -->
  <text x="690" y="128" class="lane">3 · KITTING &amp; TRACEABILITY</text>
  <rect x="670" y="140" width="260" height="170" class="stage" rx="14"/>
  <rect x="688" y="158" width="224" height="62" class="node" rx="8"/>
  <text x="700" y="181" class="t">Kitting-mode scan</text>
  <text x="700" y="200" class="s">Job number scanned → BOM loaded;</text>
  <text x="700" y="214" class="s">each reel scanned into the kit</text>
  <rect x="688" y="232" width="224" height="62" class="node" rx="8"/>
  <text x="700" y="255" class="t">Photo documentation</text>
  <text x="700" y="274" class="s">Image of every scanned reel saved</text>
  <text x="700" y="288" class="s">to the traceability database</text>

  <!-- STAGE 4: STORAGE + VERIFICATION -->
  <text x="990" y="128" class="lane">4 · STORE &amp; VERIFY</text>
  <rect x="970" y="140" width="230" height="170" class="stage" rx="14"/>
  <rect x="988" y="158" width="194" height="62" class="node" rx="8"/>
  <text x="1000" y="181" class="t">Smart rack storage</text>
  <text x="1000" y="200" class="s">Light-guided locations;</text>
  <text x="1000" y="214" class="s">location-level tracking</text>
  <rect x="988" y="232" width="194" height="62" class="node" rx="8"/>
  <text x="1000" y="255" class="t">X-ray quantity check</text>
  <text x="1000" y="274" class="s">Reel counts verified without</text>
  <text x="1000" y="288" class="s">opening packaging</text>

  <!-- flows top row -->
  <line x1="300" y1="225" x2="340" y2="225" class="flow"/>
  <line x1="630" y1="225" x2="670" y2="225" class="flow"/>
  <line x1="930" y1="225" x2="970" y2="225" class="flow"/>

  <!-- BOTTOM: DATABASE + ERP LOOP -->
  <rect x="150" y="420" width="420" height="150" class="stage" rx="14"/>
  <text x="170" y="408" class="lane">5 · TRACEABILITY DATABASE</text>
  <rect x="168" y="438" width="384" height="52" class="node" rx="8"/>
  <text x="180" y="461" class="t">Central record per reel &amp; kit</text>
  <text x="180" y="479" class="s">Fields: job · UID · part · lot · quantity issued · location · image</text>
  <rect x="168" y="500" width="384" height="52" class="node" rx="8"/>
  <text x="180" y="523" class="t">Label &amp; quantity events</text>
  <text x="180" y="541" class="s">Every print, scan, count, and move is logged with a timestamp</text>

  <rect x="680" y="420" width="420" height="150" class="stage" rx="14"/>
  <text x="700" y="408" class="lane">6 · ERP INTEGRATION (DYNAMICS 365)</text>
  <rect x="698" y="438" width="384" height="52" class="node" rx="8"/>
  <text x="710" y="461" class="t">Automated journal posting</text>
  <text x="710" y="479" class="s">Consumption &amp; location reclass journals generated and posted</text>
  <rect x="698" y="500" width="384" height="52" class="node" rx="8"/>
  <text x="710" y="523" class="t">No manual reconciliation</text>
  <text x="710" y="541" class="s">Floor reality and ERP records stay in sync by design</text>

  <!-- vertical + loop flows -->
  <path d="M 800 310 L 800 372 L 360 372 L 360 420" class="flow"/>
  <path d="M 1085 310 L 1085 372 L 890 372 L 890 420" class="flow"/>
  <line x1="570" y1="495" x2="680" y2="495" class="flow"/>
  <path d="M 890 570 L 890 640 L 170 640 L 170 310" class="flow" stroke-dasharray="6 5"/>
  <text x="380" y="632" class="s" font-style="italic">closed loop: posted ERP data validates the next receiving cycle</text>

  <text x="40" y="700" fill="#94a3b8" font-size="11.5" font-style="italic">Sanitized recreation for portfolio use — example identifiers are fictitious; vendor systems and internal process specifics omitted. Role: project lead (architecture, supplier coordination, rollout).</text>
</svg>
